name: ci

on:
  push:
    paths:
      - 'agents/**'
      - 'skills/**'
      - 'scripts/**'
      - 'tests/**'
      - 'install.sh'
      - 'install.ps1'
      - 'settings.example*.json'
      - 'shared-checkouts.example.json'
      - 'hooks/**'
      - 'global-CLAUDE.md'
      - 'capabilities.md'
      - 'ruff.toml'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'agents/**'
      - 'skills/**'
      - 'scripts/**'
      - 'tests/**'
      - 'install.sh'
      - 'install.ps1'
      - 'settings.example*.json'
      - 'shared-checkouts.example.json'
      - 'hooks/**'
      - 'global-CLAUDE.md'
      - 'capabilities.md'
      - 'ruff.toml'
      - '.github/workflows/ci.yml'

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '${{ matrix.python-version }}'
      - name: Install the tools pycheck drives (pinned - their output format is parsed)
        run: pip install ruff==0.15.20 ty==0.0.56
      - name: Agent definitions are well-formed and keep their tool properties
        run: python tests/test-agents.py
      - name: Skill definitions are well-formed
        run: python tests/test-skills.py
      - name: Hooks behave (pycheck, check-evidence)
        run: python tests/test-hooks.py
      - name: Hooks survive a Windows PowerShell 5.1 pipe (UTF-8 BOM)
        # Windows PowerShell 5.1 (the default shell on the maintainer's machine)
        # writes a BOM with -Encoding utf8 and prepends one when piping to a
        # native exe. Both hooks fail open on unparseable stdin, so a BOM would
        # silently disable them. cmd runs the pipe so stderr arrives as plain
        # text instead of PowerShell error records.
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path .tmp-bom | Out-Null
          # A tracked, unchanged fixture has no NEW findings against HEAD, so the
          # hook is exercised on untracked copies (what an edit looks like).
          Copy-Item tests/fixtures/pycheck/bad.py .tmp-bom/bad_edit.py
          Copy-Item tests/fixtures/pycheck/good.py .tmp-bom/good_edit.py
          $bad = "$PWD/.tmp-bom/bad_edit.py".Replace('\', '/')
          $good = "$PWD/.tmp-bom/good_edit.py".Replace('\', '/')
          Set-Content -Path .tmp-bom/bad.json -Encoding utf8 -Value ('{"tool_name":"Edit","tool_input":{"file_path":"' + $bad + '"}}')
          Set-Content -Path .tmp-bom/good.json -Encoding utf8 -Value ('{"tool_name":"Edit","tool_input":{"file_path":"' + $good + '"}}')
          Set-Content -Path .tmp-bom/stop.json -Encoding utf8 -Value '{"agent_id":"nope","agent_type":"implement","transcript_path":"nope.jsonl","last_assistant_message":"tests pass"}'
          $bom = [System.IO.File]::ReadAllBytes('.tmp-bom/bad.json')[0..2]
          if (-not ($bom[0] -eq 0xEF -and $bom[1] -eq 0xBB -and $bom[2] -eq 0xBF)) { throw 'Test setup: payload has no BOM, so this step would prove nothing.' }

          $out = cmd /c 'type .tmp-bom\bad.json | python scripts\pycheck.py --hook 2>&1'
          if ($LASTEXITCODE -ne 2) { throw "pycheck did not report findings through a BOM pipe (exit $LASTEXITCODE): $out" }
          if (-not (($out | Out-String) -match 'new finding')) { throw "pycheck exit 2 but no findings header: $out" }
          $out = cmd /c 'type .tmp-bom\good.json | python scripts\pycheck.py --hook 2>&1'
          if ($LASTEXITCODE -ne 0) { throw "pycheck flagged a clean file (exit $LASTEXITCODE): $out" }
          $out = cmd /c 'type .tmp-bom\stop.json | python scripts\check-evidence.py 2>&1'
          if ($LASTEXITCODE -ne 0) { throw "check-evidence must fail open when the transcript is missing (exit $LASTEXITCODE): $out" }
          if (-not (($out | Out-String) -match 'transcript')) { throw "check-evidence failed open silently; expected a notice naming the transcript: $out" }
          $global:LASTEXITCODE = 0

  installer-posix:
    # HERMETIC BY CONSTRUCTION. Every step points HOME at a sandbox inside the
    # workspace and asserts the sandbox is not the real HOME before writing, so
    # these steps are safe to copy-paste and run on a workstation. (Writing to
    # the real HOME from a CI step run locally has destroyed a developer's
    # Claude config once already.)
    runs-on: ubuntu-latest
    env:
      FAKE_HOME: ${{ github.workspace }}/.testhome
      IMPORT: '@~/.claude/agent-library/global-CLAUDE.md'
      V1SIG: 'agent-library/orchestration/handoff.schema.json'
    steps:
      - uses: actions/checkout@v5
      - name: --dry-run writes nothing
        run: |
          set -euo pipefail
          test -n "${FAKE_HOME:-}"
          test "$FAKE_HOME" != "$HOME" || { echo "ERROR: sandbox equals real HOME; refusing" >&2; exit 1; }
          rm -rf "$FAKE_HOME"
          mkdir -p "$FAKE_HOME/.claude"
          printf '# Pre-existing user rules\nSENTINEL-DO-NOT-LOSE\n' > "$FAKE_HOME/.claude/CLAUDE.md"
          HOME="$FAKE_HOME" bash ./install.sh --dry-run
          test ! -e "$FAKE_HOME/.claude/agents"
          test ! -e "$FAKE_HOME/.claude/agent-library"
          ! grep -qF -- "$IMPORT" "$FAKE_HOME/.claude/CLAUDE.md"
      - name: Pre-existing global CLAUDE.md is preserved byte-for-byte and the import lands
        run: |
          set -euo pipefail
          # A Windows-1252 byte (0xE6) is not valid UTF-8; the installer must not re-encode it.
          printf '# Pre-existing user rules \xe6\nSENTINEL-DO-NOT-LOSE' > "$FAKE_HOME/.claude/CLAUDE.md"
          HOME="$FAKE_HOME" bash ./install.sh
          grep -qF 'SENTINEL-DO-NOT-LOSE' "$FAKE_HOME/.claude/CLAUDE.md"
          LC_ALL=C grep -q $'\xe6' "$FAKE_HOME/.claude/CLAUDE.md"
          grep -qxF -- "$IMPORT" "$FAKE_HOME/.claude/CLAUDE.md"
          ls "$FAKE_HOME/.claude/" | grep -q 'CLAUDE.md.backup.'
      - name: Agents, skills and hook scripts landed identical to source
        run: |
          set -euo pipefail
          for a in explore implement review; do
            cmp -s "agents/$a.md" "$FAKE_HOME/.claude/agents/$a.md" || { echo "ERROR: agent $a missing or differs" >&2; exit 1; }
          done
          for d in skills/*/; do
            name="$(basename "$d")"
            cmp -s "$d/SKILL.md" "$FAKE_HOME/.claude/skills/$name/SKILL.md" || { echo "ERROR: skill $name missing or differs" >&2; exit 1; }
          done
          test -x "$FAKE_HOME/.claude/agent-library/scripts/pycheck.py"
          test -x "$FAKE_HOME/.claude/agent-library/scripts/check-evidence.py"
          test -x "$FAKE_HOME/.claude/agent-library/scripts/no-ask.py"
          test -x "$FAKE_HOME/.claude/agent-library/scripts/guard-shared-checkouts.py"
          test -x "$FAKE_HOME/.claude/agent-library/scripts/no-punt.py"
          test -x "$FAKE_HOME/.claude/agent-library/scripts/friction.py"
          test -x "$FAKE_HOME/.claude/agent-library/scripts/ledger.py"
          test -x "$FAKE_HOME/.claude/agent-library/scripts/check-spawn.py"
          test -x "$FAKE_HOME/.claude/agent-library/scripts/permit.py"
          test -f "$FAKE_HOME/.claude/agent-library/capabilities.md"
      - name: Install is idempotent and --verify is clean once hooks are wired
        run: |
          set -euo pipefail
          HOME="$FAKE_HOME" bash ./install.sh
          count="$(grep -cxF -- "$IMPORT" "$FAKE_HOME/.claude/CLAUDE.md")"
          test "$count" = "1" || { echo "ERROR: import line appears $count times" >&2; exit 1; }
          if HOME="$FAKE_HOME" bash ./install.sh --verify; then
            echo "ERROR: --verify passed with no settings.json (hooks not wired)" >&2
            exit 1
          fi
          cp settings.example.json "$FAKE_HOME/.claude/settings.json"
          HOME="$FAKE_HOME" bash ./install.sh --verify
      - name: --verify flags autoMode.allow without "$defaults" (list and scalar), passes with the example
        run: |
          set -euo pipefail
          python3 - "$FAKE_HOME/.claude/settings.json" <<'PY'
          import json, sys
          p = sys.argv[1]; d = json.load(open(p, encoding="utf-8"))
          d["autoMode"] = {"allow": ["Pushing to feature branches is fine"]}
          json.dump(d, open(p, "w", encoding="utf-8"), indent=2)
          PY
          if HOME="$FAKE_HOME" bash ./install.sh --verify; then
            echo "ERROR: --verify passed with autoMode.allow lacking \$defaults" >&2; exit 1
          fi
          python3 - "$FAKE_HOME/.claude/settings.json" <<'PY'
          import json, sys
          p = sys.argv[1]; d = json.load(open(p, encoding="utf-8"))
          d["autoMode"] = {"allow": "just a string"}
          json.dump(d, open(p, "w", encoding="utf-8"), indent=2)
          PY
          if HOME="$FAKE_HOME" bash ./install.sh --verify; then
            echo "ERROR: --verify passed with a scalar autoMode.allow" >&2; exit 1
          fi
          cp settings.example.json "$FAKE_HOME/.claude/settings.json"
          HOME="$FAKE_HOME" bash ./install.sh --verify
      - name: --no-overwrite leaves a differing file alone and exits 3 (INCOMPLETE)
        run: |
          set -euo pipefail
          echo '# local edit' >> "$FAKE_HOME/.claude/agents/explore.md"
          rc=0; out="$(HOME="$FAKE_HOME" bash ./install.sh --no-overwrite)" || rc=$?
          test "$rc" = "3" || { echo "ERROR: expected exit 3, got $rc" >&2; echo "$out" >&2; exit 1; }
          grep -q 'Install INCOMPLETE' <<<"$out"
          grep -qF '# local edit' "$FAKE_HOME/.claude/agents/explore.md"
          HOME="$FAKE_HOME" bash ./install.sh
          cmp -s agents/explore.md "$FAKE_HOME/.claude/agents/explore.md"
          ls "$FAKE_HOME/.claude/agents/" | grep -q 'explore.md.backup.'
      - name: --verify detects a missing import line
        run: |
          set -euo pipefail
          grep -vxF -- "$IMPORT" "$FAKE_HOME/.claude/CLAUDE.md" > "$FAKE_HOME/cm"
          mv "$FAKE_HOME/cm" "$FAKE_HOME/.claude/CLAUDE.md"
          if HOME="$FAKE_HOME" bash ./install.sh --verify; then
            echo "ERROR: --verify passed while global-CLAUDE.md was inert" >&2
            exit 1
          fi
      - name: Installer converges a duplicated import line
        run: |
          set -euo pipefail
          HOME="$FAKE_HOME" bash ./install.sh
          printf '\r\n%s\r\n\r\n%s\r\n' "$IMPORT" "$IMPORT" >> "$FAKE_HOME/.claude/CLAUDE.md"
          if HOME="$FAKE_HOME" bash ./install.sh --verify; then
            echo "ERROR: --verify passed with a duplicated import line" >&2
            exit 1
          fi
          HOME="$FAKE_HOME" bash ./install.sh
          count="$(grep -cF -- "$IMPORT" "$FAKE_HOME/.claude/CLAUDE.md")"
          test "$count" = "1" || { echo "ERROR: import appears $count times after dedupe" >&2; exit 1; }
          HOME="$FAKE_HOME" bash ./install.sh --verify
      - name: v1 files are retired (renamed, content intact), user-authored agents are not
        run: |
          set -euo pipefail
          mkdir -p "$FAKE_HOME/.claude/agent-library/orchestration"
          printf 'v1 role - schema: %s\n' "$V1SIG" > "$FAKE_HOME/.claude/agents/reviewer.md"
          echo 'my own tester agent' > "$FAKE_HOME/.claude/agents/tester.md"
          echo v1 > "$FAKE_HOME/.claude/agent-library/orchestration/handoff.md"
          echo v1 > "$FAKE_HOME/.claude/agent-library/scripts/guard-readonly-bash.py"
          if HOME="$FAKE_HOME" bash ./install.sh --verify; then
            echo "ERROR: --verify passed with stale v1 files installed" >&2
            exit 1
          fi
          HOME="$FAKE_HOME" bash ./install.sh | tee "$FAKE_HOME/install.log"
          test ! -e "$FAKE_HOME/.claude/agents/reviewer.md"
          test -e "$FAKE_HOME/.claude/agents/tester.md" || { echo "ERROR: user-authored tester.md was retired" >&2; exit 1; }
          grep -q 'NOTE: .*tester.md' "$FAKE_HOME/install.log"
          test ! -e "$FAKE_HOME/.claude/agent-library/orchestration"
          test ! -e "$FAKE_HOME/.claude/agent-library/scripts/guard-readonly-bash.py"
          grep -qF -- "$V1SIG" "$FAKE_HOME/.claude/agents/reviewer.md.retired."*
          grep -qx v1 "$FAKE_HOME/.claude/agent-library/orchestration.retired."*/handoff.md
          grep -qx v1 "$FAKE_HOME/.claude/agent-library/scripts/guard-readonly-bash.py.retired."*
          HOME="$FAKE_HOME" bash ./install.sh --verify
          rm "$FAKE_HOME/.claude/agents/tester.md"
      - name: --verify reads settings.json (v1 hooks, unwired hooks, disableAllHooks)
        run: |
          set -euo pipefail
          S="$FAKE_HOME/.claude/settings.json"
          printf '{"hooks":{"SubagentStop":[{"hooks":[{"command":"python3 ~/.claude/agent-library/scripts/check-handoff-hook.py"}]}]}}\n' > "$S"
          if HOME="$FAKE_HOME" bash ./install.sh --verify; then
            echo "ERROR: --verify passed with v1 hooks in settings.json" >&2
            exit 1
          fi
          printf '{"hooks":{}}\n' > "$S"
          if HOME="$FAKE_HOME" bash ./install.sh --verify; then
            echo "ERROR: --verify passed with no hooks wired" >&2
            exit 1
          fi
          python3 - "$S" <<'EOF'
          import json, sys
          d = json.load(open("settings.example.json")); d["disableAllHooks"] = True
          json.dump(d, open(sys.argv[1], "w"))
          EOF
          if HOME="$FAKE_HOME" bash ./install.sh --verify; then
            echo "ERROR: --verify passed with disableAllHooks: true" >&2
            exit 1
          fi
          printf 'not json\n' > "$S"
          if HOME="$FAKE_HOME" bash ./install.sh --verify; then
            echo "ERROR: --verify passed with an unparseable settings.json" >&2
            exit 1
          fi
          cp settings.example.json "$S"
          HOME="$FAKE_HOME" bash ./install.sh --verify

  installer-windows:
    # Also hermetic - see installer-posix. PowerShell resolves $HOME once at
    # session start, so the installer runs in a CHILD Windows PowerShell 5.1
    # (the maintainer's shell) whose home env vars point at the sandbox, and
    # the child is GATED: it must report $HOME inside the sandbox before any
    # destructive step runs.
    runs-on: windows-latest
    env:
      FAKE_HOME: ${{ github.workspace }}\.testhome
    steps:
      - uses: actions/checkout@v5
      - name: Installer scenarios in a sandboxed HOME (Windows PowerShell 5.1)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $fake = $env:FAKE_HOME
          if (-not $fake) { throw 'FAKE_HOME not set.' }
          if ($fake -eq $HOME) { throw 'Sandbox equals real HOME; refusing.' }
          $Import = '@~/.claude/agent-library/global-CLAUDE.md'
          $V1Sig = 'agent-library/orchestration/handoff.schema.json'

          Remove-Item -Recurse -Force $fake -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path (Join-Path $fake '.claude') | Out-Null
          $mdPath = Join-Path $fake '.claude/CLAUDE.md'
          # 5.1's -Encoding utf8 writes a BOM: the installer must keep it.
          Set-Content -Path $mdPath -Value "# Pre-existing user rules`nSENTINEL-DO-NOT-LOSE" -Encoding utf8

          $env:USERPROFILE = $fake
          $env:HOMEDRIVE = ''
          $env:HOMEPATH = ''
          $env:HOME = $fake

          $probe = & powershell -NoProfile -Command 'Write-Output $HOME'
          if ($probe.Trim() -ne $fake) { throw "Sandbox ineffective: child HOME = '$probe', expected '$fake'. Refusing to run the installer." }
          Write-Host "sandbox confirmed: $probe"

          $global:InstallerOutput = ''
          function Invoke-Installer([string]$InstallerArgs = '') {
            # -File propagates the script's exit code (3 for INCOMPLETE); -Command
            # would flatten every failure to 1. Capture stdout for assertions.
            $argList = @('-NoProfile', '-ExecutionPolicy', 'Bypass', '-File', './install.ps1')
            if ($InstallerArgs) { $argList += $InstallerArgs }
            $lines = & powershell @argList
            $lines | Out-Host
            $global:InstallerOutput = ($lines | Out-String)
            return $LASTEXITCODE
          }
          function Assert-Bom([string]$Path) {
            $b = [System.IO.File]::ReadAllBytes($Path)
            if (-not ($b.Length -ge 3 -and $b[0] -eq 0xEF -and $b[1] -eq 0xBB -and $b[2] -eq 0xBF)) { throw "$Path lost its UTF-8 BOM." }
          }

          Write-Host '--- -DryRun writes nothing ---'
          if ((Invoke-Installer '-DryRun') -ne 0) { throw 'Dry run failed.' }
          if (Test-Path (Join-Path $fake '.claude/agents')) { throw 'Dry run created the agents directory.' }
          if ((Get-Content $mdPath -Raw) -match [regex]::Escape($Import)) { throw 'Dry run modified CLAUDE.md.' }

          Write-Host '--- pre-existing CLAUDE.md must be preserved, encoding included ---'
          if ((Invoke-Installer) -ne 0) { throw 'Installer failed.' }
          $md = Get-Content $mdPath -Raw
          if ($md -notmatch 'SENTINEL-DO-NOT-LOSE') { throw 'Existing user content was lost.' }
          if ($md -notmatch [regex]::Escape($Import)) { throw 'Import line missing.' }
          Assert-Bom $mdPath
          if (-not (Get-ChildItem (Join-Path $fake '.claude') -Filter 'CLAUDE.md.backup.*')) { throw 'No backup created.' }

          Write-Host '--- a Windows-1252 CLAUDE.md is not re-encoded ---'
          [System.IO.File]::WriteAllBytes($mdPath, [byte[]](0x23, 0x20, 0xE6, 0x0A, 0x53, 0x45, 0x4E, 0x54, 0x0A))  # "# æ\nSENT\n" in cp1252
          if ((Invoke-Installer) -ne 0) { throw 'Install over a cp1252 CLAUDE.md failed.' }
          $bytes = [System.IO.File]::ReadAllBytes($mdPath)
          if ($bytes[2] -ne 0xE6) { throw 'cp1252 byte was re-encoded.' }
          if (-not ([System.Text.Encoding]::ASCII.GetString($bytes) -match [regex]::Escape($Import))) { throw 'Import missing after cp1252 append.' }

          Write-Host '--- agents and skills landed identical to source ---'
          foreach ($a in @('explore', 'implement', 'review')) {
            $installed = Join-Path $fake ".claude/agents/$a.md"
            if (-not (Test-Path $installed)) { throw "Agent $a did not install." }
            if ((Get-FileHash $installed).Hash -ne (Get-FileHash "./agents/$a.md").Hash) { throw "Installed agent $a differs from source." }
          }
          Get-ChildItem ./skills -Directory | ForEach-Object {
            $installed = Join-Path $fake ".claude/skills/$($_.Name)/SKILL.md"
            if (-not (Test-Path $installed)) { throw "Skill $($_.Name) did not install." }
            if ((Get-FileHash $installed).Hash -ne (Get-FileHash (Join-Path $_.FullName 'SKILL.md')).Hash) { throw "Installed skill $($_.Name) differs from source." }
          }
          if (-not (Test-Path (Join-Path $fake '.claude/agent-library/scripts/pycheck.py'))) { throw 'pycheck.py did not install.' }
          if (-not (Test-Path (Join-Path $fake '.claude/agent-library/scripts/check-evidence.py'))) { throw 'check-evidence.py did not install.' }
          if (-not (Test-Path (Join-Path $fake '.claude/agent-library/scripts/no-ask.py'))) { throw 'no-ask.py did not install.' }
          if (-not (Test-Path (Join-Path $fake '.claude/agent-library/scripts/guard-shared-checkouts.py'))) { throw 'guard-shared-checkouts.py did not install.' }
          if (-not (Test-Path (Join-Path $fake '.claude/agent-library/scripts/no-punt.py'))) { throw 'no-punt.py did not install.' }
          if (-not (Test-Path (Join-Path $fake '.claude/agent-library/scripts/friction.py'))) { throw 'friction.py did not install.' }
          if (-not (Test-Path (Join-Path $fake '.claude/agent-library/scripts/ledger.py'))) { throw 'ledger.py did not install.' }
          if (-not (Test-Path (Join-Path $fake '.claude/agent-library/scripts/check-spawn.py'))) { throw 'check-spawn.py did not install.' }
          if (-not (Test-Path (Join-Path $fake '.claude/agent-library/scripts/permit.py'))) { throw 'permit.py did not install.' }

          Write-Host '--- idempotent; -Verify fails until hooks are wired, then passes ---'
          if ((Invoke-Installer) -ne 0) { throw 'Second install failed.' }
          $n = (Select-String -Path $mdPath -Pattern $Import -SimpleMatch).Count
          if ($n -ne 1) { throw "Import line appears $n times, expected 1." }
          if ((Invoke-Installer '-Verify') -eq 0) { throw '-Verify passed with no settings.json (hooks not wired).' }
          $settings = Join-Path $fake '.claude/settings.json'
          Copy-Item ./settings.example.windows.json $settings -Force
          if ((Invoke-Installer '-Verify') -eq 0) { throw '-Verify passed with the placeholder interpreter path.' }
          if ($global:InstallerOutput -notmatch 'placeholder') { throw '-Verify failed but did not name the placeholder path.' }
          (Get-Content $settings -Raw).Replace('C:/ABSOLUTE/PATH/TO/python.exe', 'python') | Set-Content $settings -Encoding utf8
          if ((Invoke-Installer '-Verify') -ne 0) { throw '-Verify failed on a clean, wired install.' }

          Write-Host '--- -Verify flags autoMode.allow without $defaults (list and scalar), passes with the example ---'
          $j = Get-Content $settings -Raw | ConvertFrom-Json
          $j | Add-Member -NotePropertyName autoMode -NotePropertyValue ([pscustomobject]@{ allow = @('Pushing to feature branches is fine') }) -Force
          $j | ConvertTo-Json -Depth 10 | Set-Content $settings -Encoding utf8
          if ((Invoke-Installer '-Verify') -eq 0) { throw '-Verify passed with autoMode.allow lacking $defaults.' }
          if ($global:InstallerOutput -notmatch 'autoMode.allow') { throw '-Verify failed but did not name autoMode.allow.' }
          $j.autoMode = [pscustomobject]@{ allow = 'just a string' }
          $j | ConvertTo-Json -Depth 10 | Set-Content $settings -Encoding utf8
          if ((Invoke-Installer '-Verify') -eq 0) { throw '-Verify passed with a scalar autoMode.allow.' }
          Copy-Item ./settings.example.windows.json $settings -Force
          (Get-Content $settings -Raw).Replace('C:/ABSOLUTE/PATH/TO/python.exe', 'python') | Set-Content $settings -Encoding utf8
          if ((Invoke-Installer '-Verify') -ne 0) { throw '-Verify failed after restoring the example settings.' }

          Write-Host '--- -NoOverwrite leaves a differing file alone and exits 3 ---'
          $explore = Join-Path $fake '.claude/agents/explore.md'
          Add-Content -Path $explore -Value '# local edit' -Encoding utf8
          if ((Invoke-Installer '-NoOverwrite') -ne 3) { throw '-NoOverwrite with a differing file must exit 3.' }
          if ($global:InstallerOutput -notmatch 'Install INCOMPLETE') { throw 'Exit 3 without an INCOMPLETE summary.' }
          if ((Get-Content $explore -Raw) -notmatch 'local edit') { throw '-NoOverwrite replaced a file.' }
          if ((Invoke-Installer) -ne 0) { throw 'Reinstall after -NoOverwrite failed.' }
          if ((Get-FileHash $explore).Hash -ne (Get-FileHash ./agents/explore.md).Hash) { throw 'Reinstall did not restore explore.md.' }

          Write-Host '--- -Verify detects a missing import ---'
          (Get-Content $mdPath) | Where-Object { $_ -ne $Import } | Set-Content $mdPath -Encoding utf8
          if ((Invoke-Installer '-Verify') -eq 0) { throw '-Verify passed while global-CLAUDE.md was inert.' }

          Write-Host '--- duplicated import is converged ---'
          if ((Invoke-Installer) -ne 0) { throw 'Reinstall failed.' }
          Add-Content -Path $mdPath -Value "`r`n$Import`r`n`r`n$Import" -Encoding utf8
          if ((Invoke-Installer '-Verify') -eq 0) { throw '-Verify passed with a duplicated import line.' }
          if ((Invoke-Installer) -ne 0) { throw 'Dedupe install failed.' }
          $n = (Select-String -Path $mdPath -Pattern $Import -SimpleMatch).Count
          if ($n -ne 1) { throw "Import appears $n times after dedupe." }
          Assert-Bom $mdPath
          if ((Invoke-Installer '-Verify') -ne 0) { throw '-Verify failed after dedupe.' }

          Write-Host '--- v1 files are retired (content intact); user-authored agents are not ---'
          $stale = Join-Path $fake '.claude/agents/reviewer.md'
          $mine = Join-Path $fake '.claude/agents/tester.md'
          $staleDir = Join-Path $fake '.claude/agent-library/orchestration'
          New-Item -ItemType Directory -Force -Path $staleDir | Out-Null
          Set-Content -Path $stale -Value "v1 role - schema: $V1Sig" -Encoding utf8
          Set-Content -Path $mine -Value 'my own tester agent' -Encoding utf8
          Set-Content -Path (Join-Path $staleDir 'handoff.md') -Value 'v1' -Encoding utf8
          if ((Invoke-Installer '-Verify') -eq 0) { throw '-Verify passed with stale v1 files installed.' }
          if ((Invoke-Installer) -ne 0) { throw 'Retiring install failed.' }
          if (Test-Path $stale) { throw 'v1 agent was not retired.' }
          if (-not (Test-Path $mine)) { throw 'User-authored tester.md was retired.' }
          if ($global:InstallerOutput -notmatch 'NOTE: .*tester\.md') { throw 'Installer did not explain why tester.md was left alone.' }
          if (Test-Path $staleDir) { throw 'v1 orchestration dir was not retired.' }
          $retired = Get-ChildItem (Join-Path $fake '.claude/agents') -Filter 'reviewer.md.retired.*'
          if (-not $retired) { throw 'Retired agent backup missing.' }
          if ((Get-Content $retired[0].FullName -Raw) -notmatch [regex]::Escape($V1Sig)) { throw 'Retired agent content was not preserved.' }
          $retiredDir = Get-ChildItem (Join-Path $fake '.claude/agent-library') -Filter 'orchestration.retired.*' -Directory
          if (-not $retiredDir) { throw 'Retired orchestration dir missing.' }
          if ((Get-Content (Join-Path $retiredDir[0].FullName 'handoff.md') -Raw) -notmatch 'v1') { throw 'Retired dir content was not preserved.' }
          if ((Invoke-Installer '-Verify') -ne 0) { throw '-Verify failed after retiring v1 files.' }
          Remove-Item $mine

          Write-Host '--- -Verify reads settings.json (v1 hooks, unwired, disableAllHooks, bad JSON) ---'
          Set-Content -Path $settings -Value '{"hooks":{"SubagentStop":[{"hooks":[{"command":"python check-handoff-hook.py"}]}]}}' -Encoding utf8
          if ((Invoke-Installer '-Verify') -eq 0) { throw '-Verify passed with v1 hooks in settings.json.' }
          Set-Content -Path $settings -Value '{"hooks":{}}' -Encoding utf8
          if ((Invoke-Installer '-Verify') -eq 0) { throw '-Verify passed with no hooks wired.' }
          $cfg = (Get-Content ./settings.example.windows.json -Raw).Replace('C:/ABSOLUTE/PATH/TO/python.exe', 'python') | ConvertFrom-Json
          $cfg | Add-Member -NotePropertyName disableAllHooks -NotePropertyValue $true
          $cfg | ConvertTo-Json -Depth 10 | Set-Content $settings -Encoding utf8
          if ((Invoke-Installer '-Verify') -eq 0) { throw '-Verify passed with disableAllHooks: true.' }
          Set-Content -Path $settings -Value 'not json' -Encoding utf8
          if ((Invoke-Installer '-Verify') -eq 0) { throw '-Verify passed with an unparseable settings.json.' }
          (Get-Content ./settings.example.windows.json -Raw).Replace('C:/ABSOLUTE/PATH/TO/python.exe', 'python') | Set-Content $settings -Encoding utf8
          if ((Invoke-Installer '-Verify') -ne 0) { throw '-Verify failed with v2 hooks in settings.json.' }
          Write-Host 'all installer scenarios passed'
