name: handoff-contract

on:
  push:
    paths:
      - 'orchestration/**'
      - 'scripts/**'
      - 'tests/**'
      - 'agents/**'
      - 'install.sh'
      - 'install.ps1'
      - 'settings.example*.json'
      - '.github/workflows/handoff-contract.yml'
  pull_request:
    paths:
      - 'orchestration/**'
      - 'scripts/**'
      - 'tests/**'
      - 'agents/**'
      - 'install.sh'
      - 'install.ps1'
      - 'settings.example*.json'
      - '.github/workflows/handoff-contract.yml'

jobs:
  validate-fixtures:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python-version }}'
      - name: Ensure fixture directories and baseline files exist
        run: |
          set -euo pipefail
          test -d tests/handoff-fixtures
          test -d tests/handoff-fixtures-invalid
          test -d tests/handoff-fixtures-runtime-invalid
          test -f tests/handoff-fixtures/lead.json
          test -f tests/handoff-fixtures-invalid/missing-required-field.json
          test -f tests/handoff-fixtures-runtime-invalid/weak-proof-colon-only.json
      - name: Validate fixtures with runtime validator
        run: |
          set -euo pipefail
          shopt -s nullglob
          for f in tests/handoff-fixtures/*.json; do
            echo "Validating $f"
            python3 scripts/validate-handoff.py "$f"
          done
      - name: Validate fixtures with shell wrapper
        run: |
          set -euo pipefail
          chmod +x scripts/validate-handoff.sh
          for f in tests/handoff-fixtures/*.json; do
            echo "Wrapper-validate $f"
            ./scripts/validate-handoff.sh "$f"
          done
      - name: Assert invalid fixtures fail runtime validation
        run: |
          set -euo pipefail
          shopt -s nullglob
          for f in tests/handoff-fixtures-invalid/*.json; do
            echo "Expect runtime INVALID for $f"
            if python3 scripts/validate-handoff.py "$f"; then
              echo "ERROR: invalid fixture unexpectedly passed runtime validation: $f" >&2
              exit 1
            fi
          done
      - name: Assert agent-file handoff templates match the validator contract
        run: python3 tests/test-agent-templates.py
      - name: Run hook enforcement tests
        run: python3 tests/test-hooks.py
      - name: Validate fixtures against JSON Schema
        run: |
          set -euo pipefail
          pip install check-jsonschema
          for f in tests/handoff-fixtures/*.json; do
            echo "Schema-check $f"
            check-jsonschema --schemafile orchestration/handoff.schema.json "$f"
          done
      - name: Assert invalid fixtures fail schema validation
        run: |
          set -euo pipefail
          for f in tests/handoff-fixtures-invalid/*.json; do
            echo "Expect schema INVALID for $f"
            if check-jsonschema --schemafile orchestration/handoff.schema.json "$f"; then
              echo "ERROR: invalid fixture unexpectedly passed schema validation: $f" >&2
              exit 1
            fi
          done
      - name: Assert runtime-invalid fixtures are schema-VALID but runtime-INVALID
        # This is the two-tier contract: the runtime validator applies proof-token
        # heuristics that JSON Schema cannot express. If either half of this
        # assertion breaks, the tiers have collapsed into each other.
        run: |
          set -euo pipefail
          shopt -s nullglob
          for f in tests/handoff-fixtures-runtime-invalid/*.json; do
            echo "Expect schema VALID for $f"
            check-jsonschema --schemafile orchestration/handoff.schema.json "$f"
            echo "Expect runtime INVALID for $f"
            if python3 scripts/validate-handoff.py "$f"; then
              echo "ERROR: weak-proof fixture passed the runtime validator: $f" >&2
              exit 1
            fi
          done

  validate-powershell-wrapper:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate PowerShell wrapper with valid fixture
        shell: pwsh
        run: |
          ./scripts/validate-handoff.ps1 ./tests/handoff-fixtures/lead.json
      - name: Validate PowerShell wrapper rejects invalid fixture
        shell: pwsh
        run: |
          ./scripts/validate-handoff.ps1 ./tests/handoff-fixtures-invalid/missing-required-field.json
          if ($LASTEXITCODE -eq 0) {
            throw "Invalid fixture unexpectedly passed PowerShell wrapper validation."
          }
      - name: Run hook enforcement tests on Windows
        shell: pwsh
        run: python tests/test-hooks.py

  installer-posix:
    # The installer must leave ~/.claude/CLAUDE.md importing global-CLAUDE.md, or
    # the operating rules never load. Runner HOME is disposable, so this is safe.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pre-existing global CLAUDE.md must be preserved
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.claude"
          printf '# Pre-existing user rules\nSENTINEL-DO-NOT-LOSE\n' > "$HOME/.claude/CLAUDE.md"
          ./install.sh
          grep -qF 'SENTINEL-DO-NOT-LOSE' "$HOME/.claude/CLAUDE.md"
          grep -qF '@~/.claude/agent-library/global-CLAUDE.md' "$HOME/.claude/CLAUDE.md"
          ls "$HOME/.claude/" | grep -q 'CLAUDE.md.backup.'
          echo "preserved + imported + backed up"
      - name: Agents and hook scripts landed
        run: |
          set -euo pipefail
          test -f "$HOME/.claude/agents/reviewer.md"
          test -f "$HOME/.claude/agent-library/scripts/guard-readonly-bash.py"
          test -f "$HOME/.claude/agent-library/scripts/check-handoff-hook.py"
          test -x "$HOME/.claude/agent-library/scripts/guard-readonly-bash.py"
      - name: Install is idempotent (no duplicate import line)
        run: |
          set -euo pipefail
          ./install.sh
          count="$(grep -cF '@~/.claude/agent-library/global-CLAUDE.md' "$HOME/.claude/CLAUDE.md")"
          test "$count" = "1" || { echo "ERROR: import line appears $count times" >&2; exit 1; }
      - name: --verify passes on a clean install
        run: ./install.sh --verify
      - name: --verify detects a missing import line
        run: |
          set -euo pipefail
          grep -vF '@~/.claude/agent-library/global-CLAUDE.md' "$HOME/.claude/CLAUDE.md" > /tmp/cm
          mv /tmp/cm "$HOME/.claude/CLAUDE.md"
          if ./install.sh --verify; then
            echo "ERROR: --verify passed while global-CLAUDE.md was inert" >&2
            exit 1
          fi
          echo "drift correctly detected"

  installer-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pre-existing global CLAUDE.md must be preserved
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path (Join-Path $HOME '.claude') | Out-Null
          Set-Content -Path (Join-Path $HOME '.claude/CLAUDE.md') -Value "# Pre-existing user rules`nSENTINEL-DO-NOT-LOSE" -Encoding utf8
          ./install.ps1
          $md = Get-Content (Join-Path $HOME '.claude/CLAUDE.md') -Raw
          if ($md -notmatch 'SENTINEL-DO-NOT-LOSE') { throw 'Existing user content was lost.' }
          if ($md -notmatch [regex]::Escape('@~/.claude/agent-library/global-CLAUDE.md')) { throw 'Import line missing.' }
          if (-not (Get-ChildItem (Join-Path $HOME '.claude') -Filter 'CLAUDE.md.backup.*')) { throw 'No backup created.' }
      - name: Install is idempotent
        shell: pwsh
        run: |
          ./install.ps1
          $n = (Select-String -Path (Join-Path $HOME '.claude/CLAUDE.md') -Pattern 'agent-library/global-CLAUDE.md' -SimpleMatch).Count
          if ($n -ne 1) { throw "Import line appears $n times, expected 1." }
      - name: -Verify passes on a clean install
        shell: pwsh
        run: |
          ./install.ps1 -Verify
          if ($LASTEXITCODE -ne 0) { throw "-Verify failed on a clean install." }
      - name: -Verify detects a missing import line
        shell: pwsh
        run: |
          $p = Join-Path $HOME '.claude/CLAUDE.md'
          (Get-Content $p) | Where-Object { $_ -notmatch 'agent-library/global-CLAUDE' } | Set-Content $p -Encoding utf8
          ./install.ps1 -Verify
          if ($LASTEXITCODE -eq 0) { throw '-Verify passed while global-CLAUDE.md was inert.' }
