name: handoff-contract

on:
  push:
    paths:
      - 'orchestration/**'
      - 'scripts/**'
      - 'tests/**'
      - 'agents/**'
      - 'skills/**'
      - 'install.sh'
      - 'install.ps1'
      - 'settings.example*.json'
      - '.github/workflows/handoff-contract.yml'
  pull_request:
    paths:
      - 'orchestration/**'
      - 'scripts/**'
      - 'tests/**'
      - 'agents/**'
      - 'skills/**'
      - 'install.sh'
      - 'install.ps1'
      - 'settings.example*.json'
      - '.github/workflows/handoff-contract.yml'

jobs:
  validate-fixtures:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python-version }}'
      - name: Ensure fixture directories and baseline files exist
        run: |
          set -euo pipefail
          test -d tests/handoff-fixtures
          test -d tests/handoff-fixtures-invalid
          test -d tests/handoff-fixtures-runtime-invalid
          test -f tests/handoff-fixtures/lead.json
          test -f tests/handoff-fixtures-invalid/missing-required-field.json
          test -f tests/handoff-fixtures-runtime-invalid/weak-proof-colon-only.json
      - name: Validate fixtures with runtime validator
        run: |
          set -euo pipefail
          shopt -s nullglob
          for f in tests/handoff-fixtures/*.json; do
            echo "Validating $f"
            python3 scripts/validate-handoff.py "$f"
          done
      - name: Validate fixtures with shell wrapper
        run: |
          set -euo pipefail
          chmod +x scripts/validate-handoff.sh
          for f in tests/handoff-fixtures/*.json; do
            echo "Wrapper-validate $f"
            ./scripts/validate-handoff.sh "$f"
          done
      - name: Assert invalid fixtures fail runtime validation
        run: |
          set -euo pipefail
          shopt -s nullglob
          for f in tests/handoff-fixtures-invalid/*.json; do
            echo "Expect runtime INVALID for $f"
            if python3 scripts/validate-handoff.py "$f"; then
              echo "ERROR: invalid fixture unexpectedly passed runtime validation: $f" >&2
              exit 1
            fi
          done
      - name: Assert agent-file handoff templates match the validator contract
        run: python3 tests/test-agent-templates.py
      - name: Run hook enforcement tests
        run: python3 tests/test-hooks.py
      - name: Validate fixtures against JSON Schema
        run: |
          set -euo pipefail
          pip install check-jsonschema
          for f in tests/handoff-fixtures/*.json; do
            echo "Schema-check $f"
            check-jsonschema --schemafile orchestration/handoff.schema.json "$f"
          done
      - name: Assert invalid fixtures fail schema validation
        run: |
          set -euo pipefail
          for f in tests/handoff-fixtures-invalid/*.json; do
            echo "Expect schema INVALID for $f"
            if check-jsonschema --schemafile orchestration/handoff.schema.json "$f"; then
              echo "ERROR: invalid fixture unexpectedly passed schema validation: $f" >&2
              exit 1
            fi
          done
      - name: Assert runtime-invalid fixtures are schema-VALID but runtime-INVALID
        # This is the two-tier contract: the runtime validator applies proof-token
        # heuristics that JSON Schema cannot express. If either half of this
        # assertion breaks, the tiers have collapsed into each other.
        run: |
          set -euo pipefail
          shopt -s nullglob
          for f in tests/handoff-fixtures-runtime-invalid/*.json; do
            echo "Expect schema VALID for $f"
            check-jsonschema --schemafile orchestration/handoff.schema.json "$f"
            echo "Expect runtime INVALID for $f"
            if python3 scripts/validate-handoff.py "$f"; then
              echo "ERROR: weak-proof fixture passed the runtime validator: $f" >&2
              exit 1
            fi
          done

  validate-powershell-wrapper:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate PowerShell wrapper with valid fixture
        shell: pwsh
        run: |
          ./scripts/validate-handoff.ps1 ./tests/handoff-fixtures/lead.json
      - name: Validate PowerShell wrapper rejects invalid fixture
        shell: pwsh
        run: |
          ./scripts/validate-handoff.ps1 ./tests/handoff-fixtures-invalid/missing-required-field.json
          if ($LASTEXITCODE -eq 0) {
            throw "Invalid fixture unexpectedly passed PowerShell wrapper validation."
          }
          $global:LASTEXITCODE = 0
      - name: PowerShell wrapper accepts piped stdin
        # PowerShell hands pipeline input to $input, not to native commands
        # inside the script. This form was documented but broken; keep it tested.
        shell: pwsh
        run: |
          Get-Content ./tests/handoff-fixtures/lead.json -Raw | ./scripts/validate-handoff.ps1 -
          if ($LASTEXITCODE -ne 0) { throw "Wrapper rejected a valid handoff on stdin." }
          Get-Content ./tests/handoff-fixtures-runtime-invalid/weak-proof-colon-only.json -Raw | ./scripts/validate-handoff.ps1 -
          if ($LASTEXITCODE -eq 0) { throw "Wrapper accepted a weak proof token on stdin." }
          $global:LASTEXITCODE = 0
      - name: Hooks survive a PowerShell pipe (UTF-8 BOM)
        # PowerShell prepends a BOM when piping to a native exe. Both hooks fail
        # open on unparseable stdin, so this silently disabled enforcement.
        shell: pwsh
        run: |
          '{"agent_type":"reviewer","tool_input":{"command":"echo x > app.py"}}' | python ./scripts/guard-readonly-bash.py
          if ($LASTEXITCODE -ne 2) { throw "Bash guard failed to block a write through a PowerShell pipe (exit $LASTEXITCODE)." }
          '{"agent_type":"reviewer","tool_input":{"command":"git diff"}}' | python ./scripts/guard-readonly-bash.py
          if ($LASTEXITCODE -ne 0) { throw "Bash guard blocked read-only inspection (exit $LASTEXITCODE)." }
          '{"agent_type":"reviewer","last_assistant_message":"looks fine to me."}' | python ./scripts/check-handoff-hook.py
          if ($LASTEXITCODE -ne 2) { throw "Handoff hook failed to block prose through a PowerShell pipe (exit $LASTEXITCODE)." }
          $global:LASTEXITCODE = 0
      - name: Run hook enforcement tests on Windows
        shell: pwsh
        run: python tests/test-hooks.py

  installer-posix:
    # The installer must leave ~/.claude/CLAUDE.md importing global-CLAUDE.md, or
    # the operating rules never load.
    #
    # HERMETIC BY CONSTRUCTION. These steps used to write to the real $HOME,
    # which is fine on a disposable runner and destroys a developer's Claude
    # config the moment anyone runs a step locally to debug CI. That happened.
    # Every step now points HOME at a sandbox inside the workspace and asserts
    # the sandbox is not the real HOME before writing anything, so these steps
    # are safe to copy-paste and run on a workstation.
    runs-on: ubuntu-latest
    env:
      FAKE_HOME: ${{ github.workspace }}/.testhome
    steps:
      - uses: actions/checkout@v4
      - name: Pre-existing global CLAUDE.md must be preserved
        run: |
          set -euo pipefail
          test -n "${FAKE_HOME:-}"
          test "$FAKE_HOME" != "$HOME" || { echo "ERROR: sandbox equals real HOME; refusing" >&2; exit 1; }
          rm -rf "$FAKE_HOME"
          mkdir -p "$FAKE_HOME/.claude"
          printf '# Pre-existing user rules\nSENTINEL-DO-NOT-LOSE\n' > "$FAKE_HOME/.claude/CLAUDE.md"
          HOME="$FAKE_HOME" bash ./install.sh
          grep -qF 'SENTINEL-DO-NOT-LOSE' "$FAKE_HOME/.claude/CLAUDE.md"
          grep -qF '@~/.claude/agent-library/global-CLAUDE.md' "$FAKE_HOME/.claude/CLAUDE.md"
          ls "$FAKE_HOME/.claude/" | grep -q 'CLAUDE.md.backup.'
          echo "preserved + imported + backed up"
      - name: Agents and hook scripts landed
        run: |
          set -euo pipefail
          test -f "$FAKE_HOME/.claude/agents/reviewer.md"
          test -f "$FAKE_HOME/.claude/agent-library/scripts/guard-readonly-bash.py"
          test -f "$FAKE_HOME/.claude/agent-library/scripts/check-handoff-hook.py"
          test -x "$FAKE_HOME/.claude/agent-library/scripts/guard-readonly-bash.py"
      - name: Skills landed as slash commands
        run: |
          set -euo pipefail
          shopt -s nullglob
          found=0
          for d in skills/*/; do
            name="$(basename "$d")"
            test -f "$FAKE_HOME/.claude/skills/$name/SKILL.md" \
              || { echo "ERROR: skill $name did not install" >&2; exit 1; }
            cmp -s "$d/SKILL.md" "$FAKE_HOME/.claude/skills/$name/SKILL.md" \
              || { echo "ERROR: installed skill $name differs from source" >&2; exit 1; }
            found=$((found + 1))
          done
          test "$found" -gt 0 || { echo "ERROR: no skills found to install" >&2; exit 1; }
          echo "$found skill(s) installed and identical to source"
      - name: Skill frontmatter is well-formed
        # A skill whose frontmatter fails to parse silently does not register.
        run: python3 tests/test-skills.py
      - name: Install is idempotent (no duplicate import line)
        run: |
          set -euo pipefail
          HOME="$FAKE_HOME" bash ./install.sh
          count="$(grep -cF '@~/.claude/agent-library/global-CLAUDE.md' "$FAKE_HOME/.claude/CLAUDE.md")"
          test "$count" = "1" || { echo "ERROR: import line appears $count times" >&2; exit 1; }
      - name: --verify passes on a clean install
        run: HOME="$FAKE_HOME" bash ./install.sh --verify
      - name: --verify detects a missing import line
        run: |
          set -euo pipefail
          grep -vF '@~/.claude/agent-library/global-CLAUDE.md' "$FAKE_HOME/.claude/CLAUDE.md" > "$FAKE_HOME/cm"
          mv "$FAKE_HOME/cm" "$FAKE_HOME/.claude/CLAUDE.md"
          if HOME="$FAKE_HOME" bash ./install.sh --verify; then
            echo "ERROR: --verify passed while global-CLAUDE.md was inert" >&2
            exit 1
          fi
          echo "drift correctly detected"
      - name: Installer converges a duplicated import line
        # Reproduces observed real-world drift: the import line hand-pasted
        # extra times, with CRLF endings. The installer must dedupe to one and
        # --verify must flag the duplicated state.
        run: |
          set -euo pipefail
          IMPORT='@~/.claude/agent-library/global-CLAUDE.md'
          HOME="$FAKE_HOME" bash ./install.sh
          printf '\r\n%s\r\n\r\n%s\r\n' "$IMPORT" "$IMPORT" >> "$FAKE_HOME/.claude/CLAUDE.md"
          if HOME="$FAKE_HOME" bash ./install.sh --verify; then
            echo "ERROR: --verify passed with a duplicated import line" >&2
            exit 1
          fi
          HOME="$FAKE_HOME" bash ./install.sh
          count="$(grep -cF -- "$IMPORT" "$FAKE_HOME/.claude/CLAUDE.md")"
          test "$count" = "1" || { echo "ERROR: import appears $count times after dedupe" >&2; exit 1; }
          HOME="$FAKE_HOME" bash ./install.sh --verify
          echo "duplicate converged to one and verify is clean"

  installer-windows:
    # Also hermetic - see the comment on installer-posix.
    #
    # PowerShell resolves $HOME once at session start from the FileSystem
    # provider, so it cannot be reassigned mid-script. The installer is
    # therefore driven in a CHILD pwsh with the home env vars overridden, and
    # the child is GATED: it must report $HOME inside the sandbox before any
    # destructive step runs. All scenarios live in one step because each new
    # pwsh step would otherwise have to repeat that setup, and a step that
    # forgot it would silently target the real HOME.
    runs-on: windows-latest
    env:
      FAKE_HOME: ${{ github.workspace }}\.testhome
    steps:
      - uses: actions/checkout@v4
      - name: Installer scenarios in a sandboxed HOME
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $fake = $env:FAKE_HOME
          if (-not $fake) { throw 'FAKE_HOME not set.' }
          if ($fake -eq $HOME) { throw 'Sandbox equals real HOME; refusing.' }

          Remove-Item -Recurse -Force $fake -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path (Join-Path $fake '.claude') | Out-Null
          Set-Content -Path (Join-Path $fake '.claude/CLAUDE.md') -Value "# Pre-existing user rules`nSENTINEL-DO-NOT-LOSE" -Encoding utf8

          # Child pwsh must inherit these at startup to compute $HOME from them.
          $env:USERPROFILE = $fake
          $env:HOMEDRIVE = ''
          $env:HOMEPATH = ''
          $env:HOME = $fake

          $probe = & pwsh -NoProfile -Command 'Write-Output $HOME'
          if ($probe.Trim() -ne $fake) { throw "Sandbox ineffective: child HOME = '$probe', expected '$fake'. Refusing to run the installer." }
          Write-Host "sandbox confirmed: $probe"

          function Invoke-Installer([string]$Args = '') {
            & pwsh -NoProfile -Command "& './install.ps1' $Args"
            return $LASTEXITCODE
          }

          Write-Host '--- pre-existing CLAUDE.md must be preserved ---'
          if ((Invoke-Installer) -ne 0) { throw 'Installer failed.' }
          $mdPath = Join-Path $fake '.claude/CLAUDE.md'
          $md = Get-Content $mdPath -Raw
          if ($md -notmatch 'SENTINEL-DO-NOT-LOSE') { throw 'Existing user content was lost.' }
          if ($md -notmatch [regex]::Escape('@~/.claude/agent-library/global-CLAUDE.md')) { throw 'Import line missing.' }
          if (-not (Get-ChildItem (Join-Path $fake '.claude') -Filter 'CLAUDE.md.backup.*')) { throw 'No backup created.' }

          Write-Host '--- skills landed ---'
          Get-ChildItem ./skills -Directory | ForEach-Object {
            $installed = Join-Path $fake ".claude/skills/$($_.Name)/SKILL.md"
            if (-not (Test-Path $installed)) { throw "Skill $($_.Name) did not install." }
            if ((Get-FileHash $installed).Hash -ne (Get-FileHash (Join-Path $_.FullName 'SKILL.md')).Hash) {
              throw "Installed skill $($_.Name) differs from source."
            }
          }

          Write-Host '--- idempotent ---'
          if ((Invoke-Installer) -ne 0) { throw 'Second install failed.' }
          $n = (Select-String -Path $mdPath -Pattern 'agent-library/global-CLAUDE.md' -SimpleMatch).Count
          if ($n -ne 1) { throw "Import line appears $n times, expected 1." }

          Write-Host '--- -Verify passes clean ---'
          if ((Invoke-Installer '-Verify') -ne 0) { throw '-Verify failed on a clean install.' }

          Write-Host '--- -Verify detects a missing import ---'
          (Get-Content $mdPath) | Where-Object { $_ -notmatch 'agent-library/global-CLAUDE' } | Set-Content $mdPath -Encoding utf8
          if ((Invoke-Installer '-Verify') -eq 0) { throw '-Verify passed while global-CLAUDE.md was inert.' }
          Write-Host 'drift correctly detected'

          Write-Host '--- duplicated import is converged ---'
          if ((Invoke-Installer) -ne 0) { throw 'Reinstall failed.' }
          Add-Content -Path $mdPath -Value "`r`n@~/.claude/agent-library/global-CLAUDE.md`r`n`r`n@~/.claude/agent-library/global-CLAUDE.md" -Encoding utf8
          if ((Invoke-Installer '-Verify') -eq 0) { throw '-Verify passed with a duplicated import line.' }
          if ((Invoke-Installer) -ne 0) { throw 'Dedupe install failed.' }
          $n = (Select-String -Path $mdPath -Pattern 'agent-library/global-CLAUDE.md' -SimpleMatch).Count
          if ($n -ne 1) { throw "Import appears $n times after dedupe." }
          if ((Invoke-Installer '-Verify') -ne 0) { throw '-Verify failed after dedupe.' }
          Write-Host 'duplicate converged to one and verify is clean'
