name: handoff-contract

on:
  push:
    paths:
      - 'orchestration/handoff.schema.json'
      - 'scripts/validate-handoff.py'
      - 'tests/handoff-fixtures/**'
      - '.github/workflows/handoff-contract.yml'
  pull_request:
    paths:
      - 'orchestration/handoff.schema.json'
      - 'scripts/validate-handoff.py'
      - 'tests/handoff-fixtures/**'
      - '.github/workflows/handoff-contract.yml'

jobs:
  validate-fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate fixtures with runtime validator
        run: |
          set -euo pipefail
          shopt -s nullglob
          for f in tests/handoff-fixtures/*.json; do
            echo "Validating $f"
            python3 scripts/validate-handoff.py "$f"
          done
      - name: Validate fixtures against JSON Schema (if check-jsonschema available)
        run: |
          pip install check-jsonschema
          for f in tests/handoff-fixtures/*.json; do
            echo "Schema-check $f"
            check-jsonschema --schemafile orchestration/handoff.schema.json "$f"
          done
